name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-v4:
    if: github.event_name == 'push' && github.ref == 'refs/heads/bingx-ict2022-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bingx-ict2022-v4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply V4 production change
        run: |
          python3 tools/apply_ict2022_v4.py
          gofmt -w backend/internal/strategy/silverbullet.go
      - name: Verify V4 tests before commit
        run: |
          cd backend
          go test ./...
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/strategy/silverbullet.go
          if ! git diff --cached --quiet; then
            git commit -m "feat: loosen ICT2022 sweep-MSS-FVG research gates"
            git push origin HEAD:bingx-ict2022-v4
          fi

  backend:
    if: github.ref != 'refs/heads/bingx-ict2022-v4'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...

  frontend:
    if: github.ref != 'refs/heads/bingx-ict2022-v4'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
